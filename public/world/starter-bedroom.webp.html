)}.desk svg{width:100%;height:100%;overflow:visible}.desk:active{transform:scale(.98)}.player{left:49%;top:72%;width:7%;height:15%;transition:left .65s linear,top .65s linear;transform:translate(-50%,-75%);z-index:4;filter:drop-shadow(1px 5px 3px #0009);pointer-events:none}.player svg{width:100%;height:100%;overflow:visible}.tip{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#0b3057e8;border:2px solid #4aa2d3;border-radius:14px;padding:10px 14px;text-align:center;font-size:12px;width:max-content;max-width:90%;z-index:8}.panel{padding:12px 16px 16px;background:#103456;border-top:3px solid #3996cb}.title{font-weight:850;font-size:18px;margin-bottom:7px}.desc{color:#c2dff0;font-size:13px;line-height:1.4;min-height:37px}.buttons{display:flex;gap:8px;margin-top:9px}button{flex:1;background:#fbc44e;border:0;border-radius:12px;padding:11px 6px;font-weight:850;color:#173453;font-size:13px}button.secondary{background:#245f91;color:white;border:1px solid #69b8ef}.hint{font-size:11px;color:#a5c3dc;margin-top:9px;text-align:center}@media(min-width:650px){.room{max-width:630px}.app{max-width:740px;margin:auto}}
</style></head><body><div class="app"><header><b>Life<span style="color:#ffce5d">RPG</span></b><span class="pill">ROOM PROTOTYPE</span></header><div class="stage"><div class="room" id="room"><div class="tip" id="tip">Tap the floor to walk · Tap the desk to interact</div><div class="hit desk" id="desk" aria-label="Starter desk" role="button"><svg viewBox="0 0 180 140"><path d="M8 70 L114 37 L174 66 L67 104 Z" fill="#aa754b" stroke="#634431" stroke-width="5"/><path d="M8 70 L67 104 L67 124 L8 89Z" fill="#6f4737"/><path d="M67 104 L174 66 L174 87 L67 124Z" fill="#81523d"/><path d="M72 36 L127 18 L145 28 L90 47Z" fill="#253a52"/><path d="M75 0 L125 12 L125 47 L75 34Z" fill="#1c2f46" stroke="#0f1e30" stroke-width="4"/><path d="M81 7 L118 16 L118 37 L81 28Z" fill="#4f9fb9"/><path d="M101 42 L101 52" stroke="#182e44" stroke-width="5"/><path d="M62 72 L110 58 L137 70 L89 85Z" fill="#303744"/><path d="M75 71 L118 59" stroke="#6c7883" stroke-width="2"/><path d="M92 85 L96 88" stroke="#2a333f" stroke-width="4"/></svg></div><div class="hit player" id="player"><svg viewBox="0 0 70 125"><ellipse cx="35" cy="121" rx="27" ry="5" fill="#172035" opacity=".5"/><path d="M17 75 L29 75 L29 113 L16 113 Z M39 75 L52 75 L53 113 L40 113Z" fill="#1e2e42" stroke="#0d1927" stroke-width="4"/><path d="M18 111 L31 111 L32 119 L15 119Z M40 111 L54 111 L57 119 L40 119Z" fill="#f0f3f6"/><path d="M18 44 Q35 34 52 44 L57 84 L13 84Z" fill="#253a51" stroke="#101e30" stroke-width="4"/><path d="M17 50 L8 80 L16 83 L24 57 M52 50 L62 80 L54 83 L45 57" fill="#24374c" stroke="#111e2c" stroke-width="4"/><circle cx="35" cy="27" r="17" fill="#d99b70" stroke="#704a37" stroke-width="3"/><path d="M17 27 Q14 5 36 7 Q56 6 54 27 L48 18 L25 18Z" fill="#292328"/><circle cx="30" cy="29" r="2" fill="#23232b"/><circle cx="41" cy="29" r="2" fill="#23232b"/><path d="M30 37 Q35 40 41 36" stroke="#7b4939" fill="none" stroke-width="2"/></svg></div></div></div><section class="panel"><div class="title" id="title">Your starter room</div><div class="desc" id="desc">This is your approved room image. The desk and character are separate interactive layers, not painted into the background.</div><div class="buttons"><button id="deskButton">Use desk</button><button class="secondary" id="reset">Reset character</button></div><div class="hint">Prototype only · No coins spent · Your real app is unchanged</div></section></div><script>
const room=document.getElementById('room'),player=document.getElementById('player'),desk=document.getElementById('desk'),title=document.getElementById('title'),desc=document.getElementById('desc');let moves=0;
function move(x,y){player.style.left=Math.max(19,Math.min(80,x))+'%';player.style.top=Math.max(50,Math.min(87,y))+'%';moves++;}
function useDesk(){move(62,57);title.textContent='Starter desk · Tier 1';desc.textContent='You walked to your basic one-monitor desk. Later, tapping furniture can open upgrades and interactions.';}
desk.addEventListener('click',e=>{e.stopPropagation();useDesk()});document.getElementById('deskButton').onclick=useDesk;document.getElementById('reset').onclick=()=>{move(49,72);title.textContent='Your starter room';desc.textContent='Tap anywhere on the floor to move your character, or tap the desk to interact.'};room.addEventListener('click',e=>{if(e.target.closest('.tip'))return;const r=room.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;move(x,y);title.textContent='Exploring your room';desc.textContent='Character movement works! This first test uses simple movement; later we can add walking animations and obstacle avoidance.'});
</script></body></html>
